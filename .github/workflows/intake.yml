name: Catalog intake
on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: python3 .github/scripts/intake.py --report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
